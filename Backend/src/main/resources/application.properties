spring.application.name=appzys-web-backend
server.port=${PORT:8080}
spring.config.import=optional:classpath:application-local.properties

# In-Memory Database (No external MySQL server needed)
spring.datasource.url=jdbc:h2:mem:appzys_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.sql.init.mode=never

# CORS allowed origins (Vite Dev + Render + Production Domain)
appzys.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://appzys.com,https://www.appzys.com}
appzys.site.base-url=${SITE_BASE_URL:https://appzys.com}
appzys.notify.email=${APPZYS_NOTIFY_EMAIL:appzys.dev@gmail.com}

# Gmail notification delivery. MAIL_PASSWORD must be a Gmail App Password set in the deployment environment.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:appzys.dev@gmail.com}
spring.mail.password=${MAIL_PASSWORD:wgsy ciwl gsii cnyo}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
